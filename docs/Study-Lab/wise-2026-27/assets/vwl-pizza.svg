<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-labelledby="t d"><title id="t">Zusatzrechnung je Pizza</title><desc id="d">5 Euro Erlös minus 3,50 Euro Zutaten ergeben 1,50 Euro Deckungsbeitrag, bei freier Kapazität und ohne weitere Zusatzkosten.</desc><rect width="360" height="300" fill="white"/><g font-family="Arial,sans-serif" fill="#172b40"><text x="16" y="32" font-size="22" font-weight="bold">Je zusätzliche Pizza</text><text x="16" y="70" font-size="20">Erlös: 5,00 €</text><rect x="16" y="88" width="320" height="55" fill="#164e75"/><rect x="240" y="88" width="96" height="55" fill="#087f5b"/><text x="26" y="122" fill="white" font-size="18">Zutaten 3,50 €</text><text x="248" y="122" fill="white" font-size="17">DB 1,50 €</text><text x="16" y="179" font-size="17">DB = zusätzlicher Deckungsbeitrag</text><text x="16" y="218" font-size="17">Annahme: freie Kapazität,</text><text x="16" y="245" font-size="17">keine weiteren Zusatzkosten.</text><text x="16" y="279" font-size="17">Kein Nachweis für Gesamtgewinn.</text></g></svg>